<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rifle Queimada Online</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed arena canvas, slim HUD on top, thumb controls at the bottom; screens overlay the live key visual. Single dark look by design. */
:root{
  --ink:#070a16; --ink2:#10152c; --line:#283157;
  --paper:#f2f4ff; --muted:#8e95bd;
  --fire:#4fb6ff; --fire2:#1d5bff; --red:#ff3b55; --gold:#f2c14e;
  --raven:#5aa9ff; --viper:#ff4d6d; --ok:#4fe3a1;
  --display:'Dela Gothic One','Arial Black',Impact,sans-serif;
  --body:'DotGothic16','Zen Kaku Gothic New',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rnd{display:grid;line-height:1.05;min-width:0}
.rnd b{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.08em;color:var(--fire)}
.rnd span{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lives{display:flex;gap:5px;align-items:center}
.lives i{width:16px;height:16px;display:block;background:var(--red);clip-path:path('M8 15 L1.5 8.2 A3.9 3.9 0 0 1 8 3.2 A3.9 3.9 0 0 1 14.5 8.2 Z');filter:drop-shadow(0 0 4px rgba(255,59,85,.6))}
.lives i.off{background:#2a3157;filter:none}
.en{display:grid;justify-items:end;gap:3px}
.en small{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:900}
.enbar{width:90px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.enbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fire2),var(--fire),#e9fbff);transition:width .15s}

#controls{position:fixed;left:0;right:0;bottom:0;z-index:6;height:236px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#joyzone{pointer-events:auto;position:relative;flex:1;height:100%;touch-action:none;min-width:0}
#joybase{position:absolute;left:4px;bottom:16px;width:108px;height:108px;border-radius:50%;
  border:2px solid rgba(242,244,255,.2);background:radial-gradient(circle,rgba(79,182,255,.12),rgba(7,10,22,.4))}
#joyknob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(242,244,255,.88);box-shadow:0 0 0 4px rgba(79,182,255,.35)}
#btns{pointer-events:auto;display:grid;grid-template-columns:auto auto;grid-template-areas:"sw sp" "ag th" "es pu";gap:9px;align-items:center;justify-items:center}
.b{font-family:var(--display);font-weight:400;color:var(--paper);border-radius:50%;border:2px solid rgba(242,244,255,.28);
  background:rgba(16,21,44,.84);display:grid;place-content:center;text-align:center;line-height:1.05;touch-action:none;cursor:pointer;padding:0;letter-spacing:.02em}
.b small{display:block;font-family:var(--body);font-weight:900;font-size:9px;margin-top:3px;color:var(--muted)}
.b:focus-visible{outline:3px solid var(--fire);outline-offset:2px}
.b.down{transform:scale(.92)}
.b.off{opacity:.4}
.sm{width:54px;height:54px;font-size:8.5px}
.md{width:66px;height:66px;font-size:9.5px}
.lg{width:84px;height:84px;font-size:10px}
#bSwitch{grid-area:sw;border-color:var(--sw,var(--viper))}
#bSpecial{grid-area:sp}
#bCatch{grid-area:ag;border-color:var(--gold)}
#bDodge{grid-area:es}
#bJump{grid-area:pu;border-color:var(--ok)}
#bThrow{grid-area:th;border-color:var(--fire);background:radial-gradient(circle at 40% 35%,#5cc3ff,#1d4fd8)}
#bThrow.off{background:rgba(16,21,44,.84);border-color:rgba(242,244,255,.28);opacity:.5}
#bSpecial.ready{border-color:var(--gold);box-shadow:0 0 18px rgba(242,193,78,.55)}
.b.pulse{animation:pulse .35s infinite alternate}
@keyframes pulse{to{transform:scale(1.12);box-shadow:0 0 26px rgba(255,255,255,.75);border-color:#fff}}

#screen{position:fixed;inset:0;z-index:20;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(180deg,rgba(7,10,22,0) 0%,rgba(7,10,22,.35) 30%,rgba(7,10,22,.94) 62%);
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#screen[hidden]{display:none}
body.noctl #controls{opacity:0;pointer-events:none}body.noctl #controls *{pointer-events:none}
#screen.solid{background:linear-gradient(180deg,rgba(7,10,22,.55),rgba(7,10,22,.95) 45%);justify-content:center}
.card{max-width:560px;width:100%;margin:0 auto;display:grid;gap:16px}
.kick{font-size:11px;letter-spacing:.22em;font-weight:900;color:var(--gold);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px,13.5vw,90px);line-height:.88;text-wrap:balance;text-shadow:0 0 30px rgba(79,182,255,.35)}
h1 em{display:block;font-style:normal;color:var(--fire);transform:skewX(-9deg);transform-origin:left;text-shadow:4px 4px 0 rgba(29,91,255,.45)}
h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,8.5vw,50px);line-height:.95;text-wrap:balance}
.lead{margin:0;font-size:15px;line-height:1.55;max-width:62ch;color:#d6daf2}
ul.intel{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.intel li{font-size:14px;line-height:1.45;padding-left:16px;position:relative;color:#d6daf2}
ul.intel li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;background:var(--fire);transform:rotate(45deg)}
.go{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.04em;color:#fff;background:linear-gradient(180deg,#4fb6ff,#1d4fd8);border:0;border-radius:12px;padding:16px 22px;cursor:pointer;justify-self:start;box-shadow:0 6px 0 #10307f}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #10307f}
.go:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.go.red{background:linear-gradient(180deg,#ff5a70,#c81d3a);box-shadow:0 6px 0 #7a1022}
.opt{display:flex;gap:10px;align-items:center;font-size:14px;color:#c9cdea}
.opt input{width:20px;height:20px;accent-color:var(--fire)}
.keys{font-size:12px;line-height:1.6;color:var(--muted);margin:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who{border-radius:12px;padding:10px 12px;background:var(--ink2);border:1px solid var(--line);border-top:3px solid var(--c);display:grid;gap:4px;min-width:0}
.who i{font-style:normal;font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--c)}
.who b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.05}
.who p{margin:0;font-size:12.5px;line-height:1.45;color:#c4c9e8}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.item{text-align:left;font:inherit;color:inherit;cursor:pointer;border-radius:14px;padding:14px;background:var(--ink2);border:2px solid var(--line);display:grid;gap:6px}
.item:hover,.item:focus-visible{border-color:var(--fire);outline:none}
.item b{font-family:var(--display);font-weight:400;font-size:16px}
.item span{font-size:13px;line-height:1.4;color:#c4c9e8}
.item i{font-style:normal;font-size:10px;letter-spacing:.14em;font-weight:900;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:3px}
.stat b{font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:reduce){.b.pulse{animation:none;border-color:#fff}}
</style>

<canvas id="cv"></canvas>

<div id="hud">
  <div class="rnd"><b id="mN">PARTIDA 1</b><span id="mT">Os Forçados</span><span id="tmr" style="color:var(--paper)">SET 1 · 0:00</span></div>
  <div class="lives" id="lives"></div>
  <div class="en"><small>FOCO</small><div class="enbar"><i id="enfill"></i></div></div>
</div>

<div id="controls">
  <div id="joyzone"><div id="joybase"><div id="joyknob"></div></div></div>
  <div id="btns">
    <button id="bSwitch" class="b sm" type="button">TROCAR<small id="swName">Viper</small></button>
    <button id="bSpecial" class="b sm" type="button"><span id="spName">RAVEN EYE</span><small id="spCost">50</small></button>
    <button id="bCatch" class="b md" type="button">AGARRAR<small>segure</small></button>
    <button id="bDodge" class="b md" type="button">ESQUIVA</button>
    <button id="bJump" class="b md" type="button">PULO</button>
    <button id="bThrow" class="b lg" type="button">ARREMES-<br>SAR<small>segure p/ carregar</small></button>
  </div>
</div>

<div id="screen"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'),MAIN=cv.getContext('2d');let ctx=MAIN,PXW=3;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const INK='#070a16',G=9.8,HALF=4.1,MID=6.5,CL=13,ZC=8,H0=11;
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

/* ================= layout & projection ================= */
let W=0,H=0,DPR=1,F=300,CX=0,HY=0,TOP=60;
const cam={x:0,h:H0,zoom:1,fx:0,fy:0,roll:0,shake:0,ox:0,oy:0};
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;PXW=W<560?3:4;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  TOP=$('#hud').getBoundingClientRect().bottom+4;
  const bot=$('#controls').getBoundingClientRect().top+64;
  const spanK=H0/ZC-(H0-6)/(ZC+CL+2.6);
  F=Math.max(140,Math.min(1.36*W*ZC/9,(bot-TOP-30)/spanK));
  const extra=Math.max(0,(bot-TOP-30)-spanK*F);
  CX=W/2;HY=bot-extra*.45-(H0/ZC)*F;
}
addEventListener('resize',resize);
function P(x,y,z){
  const D=Math.max(.6,z+ZC),s=F/D;
  let sx=CX+(x-cam.x)*s,sy=HY+(cam.h-y)*s;
  sx=cam.fx+(sx-cam.fx)*cam.zoom;sy=cam.fy+(sy-cam.fy)*cam.zoom;
  return{x:sx+cam.ox,y:sy+cam.oy,s:s*cam.zoom};
}

/* ================= audio & voice ================= */
let AC=null,NB=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate;NB=AC.createBuffer(1,n,n);const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function osc(type,f0,f1,dur,vol){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol,f0,f1){const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.Q.value=1.3;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur+.05)}
function sfx(k){if(!AC)return;try{({
  throw:()=>{noise(.25,.35,500,2800);osc('sine',300,120,.2,.1)},
  big:()=>{noise(.5,.5,250,4200);osc('sawtooth',110,40,.5,.14)},
  hit:()=>{osc('sine',170,38,.45,.7);noise(.15,.45,2200,300)},
  guard:()=>{osc('square',700,300,.12,.12);noise(.1,.35,3000,1200)},
  dash:()=>noise(.15,.22,2600,800),
  catch:()=>{osc('triangle',500,1300,.14,.28);noise(.06,.3,4000,2000)},
  scan:()=>osc('sine',300,1500,.7,.15),
  bt:()=>{osc('sine',600,90,1.2,.25);noise(.6,.15,1500,200)},
  esc:()=>{noise(.4,.3,400,3800);osc('triangle',900,1800,.25,.12)},
  cut:()=>{noise(.25,.35,5000,600);osc('square',220,880,.18,.1)},
  shot:()=>{noise(.12,.5,4200,700);osc('square',150,60,.15,.15)},
  go:()=>osc('square',440,880,.25,.14),
  rewind:()=>{osc('sawtooth',900,120,1.4,.12);noise(1.4,.12,6000,400)},
  whistle:()=>{osc('sine',2400,2300,.35,.12)},
}[k]||(()=>{}))()}catch(e){}}
let VOX=[],lastSay=0;
function loadVoices(){try{VOX=speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang))}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
function say(text,pitch){
  if(!S.voice||!('speechSynthesis' in window))return;
  const now=performance.now();if(now-lastSay<380)return;lastSay=now;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[!.…?]/g,''));u.lang='pt-BR';
    const v=VOX.find(v=>/BR/i.test(v.lang))||VOX[0];if(v)u.voice=v;u.rate=1.3;u.pitch=pitch;speechSynthesis.speak(u)}catch(e){}
}

/* ================= looks (character art direction) ================= */
const SH_A='#f4f6fb',CO_A='#1c2a58',SH_R='#14162a',CO_R='#f2c14e',SH_C='#9aa0b6',CO_C='#4c5268';
const LOOKS={
  raven:{hair:'spiky',skin:'#f3d3bd',shade:'#d6a58b',hc:'#1b2038',hs:'#0a0d1a',hh:'#7a9be0',i1:'#173264',i2:'#a8d6ff',shirt:SH_A,collar:CO_A,acc:'#5aa9ff',brow:'#141a2e',male:true,glasses:true},
  viper:{hair:'pony',skin:'#f8dccb',shade:'#e0aa93',hc:'#cc1838',hs:'#6e0a20',hh:'#ff93a8',i1:'#6e2a04',i2:'#ffd04a',shirt:SH_A,collar:'#8a1630',acc:'#ff4d6d',brow:'#7a0f24',male:false},
  rudy:{hair:'short',skin:'#e7b48f',shade:'#c48d69',hc:'#6b4a2f',hs:'#3b2818',hh:'#a8825e',i1:'#3b2a1a',i2:'#9a7a52',shirt:SH_C,collar:CO_C,acc:'#9aa0b6',brow:'#3b2818',male:true},
  dot:{hair:'bob',skin:'#f1cfb6',shade:'#d4a68a',hc:'#3a2a22',hs:'#1e140f',hh:'#7a5a48',i1:'#2c3a26',i2:'#8fb07a',shirt:SH_C,collar:CO_C,acc:'#9aa0b6',brow:'#2a1d16',male:false},
  victoria:{hair:'wavy',skin:'#f7dfd0',shade:'#ddb3a0',hc:'#c9b4ea',hs:'#8a73b3',hh:'#f1e8ff',i1:'#3f1f6b',i2:'#d4a6ff',shirt:SH_R,collar:CO_R,acc:'#f2c14e',brow:'#7d6aa3',male:false},
  preston:{hair:'undercut',skin:'#efc9ad',shade:'#cf9f82',hc:'#4a2e1c',hs:'#24150c',hh:'#8a6248',i1:'#3a2410',i2:'#c99a5a',shirt:SH_R,collar:CO_R,acc:'#f2c14e',brow:'#24150c',male:true},
  chase:{hair:'spiky',skin:'#e9bf9c',shade:'#c99673',hc:'#d39a42',hs:'#8a5a1c',hh:'#ffe0a0',i1:'#1f4a2a',i2:'#8fe0a0',shirt:SH_R,collar:CO_R,acc:'#f2c14e',brow:'#8a5a1c',male:true},
  sabrina:{hair:'pony',skin:'#d9a27e',shade:'#b47c5a',hc:'#2b2246',hs:'#140f24',hh:'#6c5aa8',i1:'#3a1430',i2:'#e08ac0',shirt:SH_R,collar:CO_R,acc:'#f2c14e',brow:'#140f24',male:false},
  duke:{hair:'undercut',skin:'#c98e66',shade:'#a46c48',hc:'#161616',hs:'#000',hh:'#555',i1:'#2a1a0a',i2:'#d0902a',shirt:SH_R,collar:CO_R,acc:'#f2c14e',brow:'#0a0a0a',male:true},
  vivian:{hair:'wavy',skin:'#f5d8c6',shade:'#d8ab95',hc:'#121218',hs:'#000',hh:'#5a5a7a',i1:'#5a0a1a',i2:'#ff5a70',shirt:SH_R,collar:CO_R,acc:'#f2c14e',brow:'#0a0a10',male:false},
  miles:{hair:'slick',skin:'#f6dcc8',shade:'#d8ae96',hc:'#eef0f8',hs:'#a9afc6',hh:'#ffffff',i1:'#3a1f6c',i2:'#d2aaff',shirt:'#f6f1e3',collar:'#c9a23a',acc:'#f2c14e',brow:'#9aa0b8',male:true},
  celeste:{hair:'bob',skin:'#f9e3d6',shade:'#dfb8a6',hc:'#ece6da',hs:'#b7ad9c',hh:'#ffffff',i1:'#0e4a52',i2:'#6fe8e0',shirt:'#f6f1e3',collar:'#c9a23a',acc:'#f2c14e',brow:'#b7ad9c',male:false},
};

/* ---------- portrait (big anime bust, drawn in face units) ---------- */
function facePath(){ctx.beginPath();ctx.moveTo(-.5,-.25);ctx.bezierCurveTo(-.52,.1,-.46,.3,-.32,.47);ctx.bezierCurveTo(-.2,.6,-.07,.68,0,.69);ctx.bezierCurveTo(.07,.68,.2,.6,.32,.47);ctx.bezierCurveTo(.46,.3,.52,.1,.5,-.25);ctx.bezierCurveTo(.5,-.72,-.5,-.72,-.5,-.25);ctx.closePath()}
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath()}
function backHair(L,t){
  ctx.fillStyle=L.hc;
  const sw=Math.sin(t*2.2)*.05;
  if(L.hair==='spiky'){poly([[-.62,.3],[-.84,-.02],[-.68,-.28],[-.9,-.55],[-.58,-.64],[-.64,-.98],[-.28,-.84],[-.12,-1.08],[.12,-.86],[.44,-1.02],[.52,-.72],[.86,-.74],[.68,-.44],[.92,-.2],[.68,-.04],[.8,.28],[.56,.18]]);ctx.fill();ctx.stroke()}

      think(me(),me().id==='raven'?pick(['Esse momento... eu já vivi.','De novo. Agora eu sei de onde ela vem.']):pick(['De novo. Dessa vez eu pego.','Eu lembro dessa bola.']),true)}}
  else if(S.mode==='resume'){S.resumeT-=dt;if(S.resumeT<=0)S.mode='play'}
  else if(S.mode==='setban'){S.banT-=dt;if(S.banT<=0){S.mode='intro';S.introT=2.6;sfx('go')}}
  else if(S.mode==='vs'){S.vsT-=dt;if(S.vsT<=0){S.mode='intro';S.introT=2.6;sfx('go')}}

  for(const q of S.parts){q.t+=fdt;q.x+=q.vx*fdt;q.y+=q.vy*fdt;q.z+=q.vz*fdt;q.vx*=.96;q.vz*=.96}S.parts=S.parts.filter(q=>q.t<q.life);

}
